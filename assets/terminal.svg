<svg xmlns="http://www.w3.org/2000/svg" width="820" height="660" viewBox="0 0 820 660" role="img" aria-label="Terminal card for alpha@icodealpha">
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 14px; fill: #e6edf3; white-space: pre; }
    .k { fill: #ffa657; }
    .v { fill: #79c0ff; }
    .g { fill: #7ee787; font-weight: bold; }
    .h { fill: #e6edf3; font-weight: bold; }
    .d { fill: #6e7681; }

    /* Everything is visible by default. Animations only hide an element
       briefly before its delay, so static viewers still see the full card. */
    .r { animation: pop .28s ease-out backwards; animation-delay: var(--d, 0s); }
    .ch { animation: ltr .01s steps(1) backwards; animation-delay: var(--d, 0s); }
    .cur { animation: blink 1.1s steps(1) infinite; }

    @keyframes pop { from { opacity: 0; transform: translateX(-8px); } }
    @keyframes ltr { from { fill-opacity: 0; } }
    @keyframes blink { 50% { opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      .r, .ch, .cur { animation: none !important; }
    }
  </style>

  <!-- window -->
  <rect x="0.5" y="0.5" width="819" height="659" rx="10" fill="#0d1117" stroke="#30363d"/>
  <path d="M0.5 36 V10.5 a10 10 0 0 1 10 -10 H809.5 a10 10 0 0 1 10 10 V36 Z" fill="#161b22"/>
  <line x1="0.5" y1="36" x2="819.5" y2="36" stroke="#30363d"/>
  <circle cx="24" cy="18" r="6" fill="#ff5f56"/>
  <circle cx="44" cy="18" r="6" fill="#ffbd2e"/>
  <circle cx="64" cy="18" r="6" fill="#27c93f"/>
  <text x="410" y="23" text-anchor="middle" class="d">alpha@icodealpha: ~</text>

  <!-- prompt: the command types itself letter by letter -->
  <text x="24" y="64"><tspan class="g">alpha@icodealpha:~$</tspan> <tspan class="ch" style="--d:0.5s">n</tspan><tspan class="ch" style="--d:0.56s">e</tspan><tspan class="ch" style="--d:0.62s">o</tspan><tspan class="ch" style="--d:0.68s">f</tspan><tspan class="ch" style="--d:0.74s">e</tspan><tspan class="ch" style="--d:0.8s">t</tspan><tspan class="ch" style="--d:0.86s">c</tspan><tspan class="ch" style="--d:0.92s">h</tspan></text>

  <!-- output prints line by line -->
  <text class="r g" style="--d:1.2s" x="24" y="96">alpha@icodealpha</text>
  <line class="r" style="--d:1.2s" x1="180" y1="92" x2="796" y2="92" stroke="#30363d"/>
  <text class="r" style="--d:1.29s" x="24" y="124"><tspan class="k">OS:</tspan><tspan class="v" x="250">Alpha (dev)</tspan></text>
  <text class="r" style="--d:1.38s" x="24" y="146"><tspan class="k">Uptime:</tspan><tspan class="v" x="250">Timeless Building</tspan></text>
  <text class="r" style="--d:1.47s" x="24" y="168"><tspan class="k">Host:</tspan><tspan class="v" x="250">Solo Founder, Nairobi, Kenya</tspan></text>
  <text class="r" style="--d:1.56s" x="24" y="190"><tspan class="k">Kernel:</tspan><tspan class="v" x="250">Full-Stack + AI/ML Engineer</tspan></text>
  <text class="r" style="--d:1.65s" x="24" y="222"><tspan class="k">Languages.Programming:</tspan><tspan class="v" x="250">TypeScript, Python, JavaScript</tspan></text>
  <text class="r" style="--d:1.74s" x="24" y="244"><tspan class="k">Languages.Framework:</tspan><tspan class="v" x="250">React, Next.js, React Native (Expo)</tspan></text>
  <text class="r" style="--d:1.83s" x="24" y="266"><tspan class="k">Languages.AI/ML:</tspan><tspan class="v" x="250">TensorFlow, PyTorch, LangChain</tspan></text>
  <text class="r" style="--d:1.92s" x="24" y="288"><tspan class="k">Languages.Backend:</tspan><tspan class="v" x="250">Node.js, FastAPI, Firebase, Supabase</tspan></text>
  <text class="r" style="--d:2.01s" x="24" y="320"><tspan class="k">Currently Building:</tspan><tspan class="v" x="250">Sanctum, Chobo, Wakili, Sipha, RedRush</tspan></text>
  <text class="r" style="--d:2.1s" x="24" y="342"><tspan class="k">Deep-Diving:</tspan><tspan class="v" x="250">Cybersecurity</tspan></text>
  <text class="r" style="--d:2.19s" x="24" y="364"><tspan class="k">Hobbies:</tspan><tspan class="v" x="250">Open source, hackathons, AI Tinkerers Nairobi</tspan></text>
  <text class="r h" style="--d:2.28s" x="24" y="396">Contact</text>
  <line class="r" style="--d:2.28s" x1="100" y1="392" x2="796" y2="392" stroke="#30363d"/>
  <text class="r" style="--d:2.37s" x="24" y="424"><tspan class="k">Email:</tspan><tspan class="v" x="250">alphamunene5@gmail.com</tspan></text>
  <text class="r" style="--d:2.46s" x="24" y="446"><tspan class="k">Founder | Sanctumental:</tspan><tspan class="v" x="250">sanctumental.com</tspan></text>
  <text class="r" style="--d:2.55s" x="24" y="468"><tspan class="k">Founder | Chobo:</tspan><tspan class="v" x="250">chobo.co.ke</tspan></text>
  <text class="r" style="--d:2.64s" x="24" y="490"><tspan class="k">Portfolio:</tspan><tspan class="v" x="250">alphamunene.vercel.app</tspan></text>
  <text class="r" style="--d:2.73s" x="24" y="512"><tspan class="k">LinkedIn:</tspan><tspan class="v" x="250">/in/icodealpha</tspan></text>
  <text class="r" style="--d:2.82s" x="24" y="534"><tspan class="k">GitHub:</tspan><tspan class="v" x="250">github.com/IcodeAlpha</tspan></text>
  <text class="r h" style="--d:2.91s" x="24" y="566">GitHub Stats</text>
  <line class="r" style="--d:2.91s" x1="140" y1="562" x2="796" y2="562" stroke="#30363d"/>
  <text class="r" style="--d:3.0s" x="24" y="594"><tspan class="k">Repos:</tspan><tspan class="v" x="250">72</tspan></text>

  <!-- closing prompt appears last, then the cursor blinks -->
  <text class="r g" style="--d:3.24s" x="24" y="628">alpha@icodealpha:~$</text>
  <g class="r" style="--d:3.24s"><rect class="cur" fill="#7ee787" x="196" y="615" width="9" height="16"/></g>
</svg>
